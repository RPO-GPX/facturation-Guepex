<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application en maintenance</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.14), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(16,185,129,.12), transparent 32%),
        #f5f7fb;
      color: #172033;
    }
    .card {
      width: min(620px, 100%);
      background: rgba(255,255,255,.96);
      border: 1px solid #e5eaf2;
      border-radius: 24px;
      padding: 48px 38px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(31,41,55,.12);
    }
    .icon {
      width: 92px;
      height: 92px;
      margin: 0 auto 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #eef4ff;
      font-size: 46px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.15;
    }
    .lead {
      margin: 0 auto 22px;
      max-width: 500px;
      color: #5b6578;
      font-size: 17px;
      line-height: 1.7;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 15px;
      border-radius: 999px;
      background: #fff7e6;
      color: #9a6700;
      font-size: 14px;
      font-weight: 700;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    .footer {
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid #edf0f5;
      color: #8a93a3;
      font-size: 13px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.8); }
    }
    @media (max-width: 520px) {
      .card { padding: 38px 24px; border-radius: 20px; }
      .icon { width: 78px; height: 78px; font-size: 38px; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">🔧</div>
    <div class="status">
      <span class="dot"></span>
      Maintenance en cours
    </div>
    <h1 style="margin-top:22px;">Application temporairement indisponible</h1>
    <p class="lead">
      Nous effectuons actuellement des opérations de maintenance afin
      d’améliorer l’application et sa fiabilité.
      Merci de patienter et de réessayer ultérieurement.
    </p>
    <div class="footer">
      Merci pour votre compréhension.
    </div>
  </main>
</body>
</html>
